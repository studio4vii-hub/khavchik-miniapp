dding:0 15px;min-height:50px;backdrop-filter:blur(16px)}.search svg{width:19px;flex:none}.search input{background:none;border:0;outline:0;color:#fff;width:100%;font-size:13px}.search input::placeholder{color:#e5e2df}.categories{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:16px 0 6px;margin:0 -1px;flex:none}.categories::-webkit-scrollbar{display:none}.category{min-width:67px;min-height:65px;border-radius:15px;padding:10px 8px;border:1px solid rgba(255,255,255,.16);background:rgba(48,48,48,.75);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;flex:none;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}.category.active{background:var(--yellow);color:#191919;border-color:var(--yellow)}.category svg{width:21px;height:21px}.content{padding:23px 18px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 16px}.section-head h2{font-size:22px;letter-spacing:-.8px;margin:0}.text-link{background:none;border:0;color:#9a7200;font-size:12px;font-weight:800;white-space:nowrap}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.product-card{background:var(--paper);border-radius:19px;overflow:hidden;box-shadow:var(--shadow);min-width:0;transition:transform .15s}.product-card:active{transform:scale(.985)}.product-img{width:100%;height:150px;object-fit:cover;display:block;background:#d7c6ac}.product-info{padding:11px 12px 13px}.product-title{font-weight:800;font-size:15px;line-height:1.2;letter-spacing:-.3px}.product-sub{color:var(--muted);font-size:10px;line-height:1.45;margin-top:5px;min-height:28px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.product-bottom{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:10px}.price{font-weight:800;font-size:17px;white-space:nowrap}.round-add{width:37px;height:37px;border:0;background:var(--yellow);border-radius:50%;display:grid;place-items:center;box-shadow:0 5px 12px rgba(245,182,0,.22);font-size:24px;font-weight:500;line-height:1}.demo-note{font-size:10px;color:#777;margin:18px 2px 0}.navbar{position:fixed;z-index:30;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 26px);max-width:414px;height:66px;border-radius:21px;background:rgba(30,30,30,.97);box-shadow:0 10px 35px rgba(0,0,0,.23);display:flex;align-items:center;padding:5px;gap:2px;backdrop-filter:blur(18px)}.navbtn{border:0;background:transparent;color:#bdbdbd;flex:1;height:56px;min-width:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;position:relative}.navbtn svg{width:21px;height:21px}.navbtn.active{background:var(--yellow);color:#181818}.count-dot{position:absolute;right:20%;top:0;background:var(--yellow);color:#111;border-radius:30px;min-width:18px;height:18px;padding:1px 4px;font-size:10px;font-weight:800}.page-top{height:90px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 19px 17px;background:#222;color:#fff}.page-top h1{font-size:25px;line-height:1;margin:0;letter-spacing:-.8px}.back{border:0;background:rgba(255,255,255,.13);color:#fff;border-radius:50%;width:40px;height:40px;font-size:24px}.menu-tabs{display:flex;overflow:auto;gap:8px;scrollbar-width:none;padding:19px 18px 14px}.menu-tabs::-webkit-scrollbar{display:none}.pill{border:0;border-radius:999px;background:#e9e4df;padding:10px 15px;white-space:nowrap;font-size:12px;font-weight:800}.pill.active{background:var(--yellow)}.menu-list{display:grid;gap:11px;padding:0 17px 25px}.menu-item{display:flex;gap:13px;background:var(--paper);padding:10px;border-radius:22px;box-shadow:var(--shadow);align-items:center;min-height:113px}.menu-item img{width:105px;height:95px;object-fit:cover;border-radius:16px;flex:none}.menu-item-main{min-width:0;flex:1}.menu-item-main h3{margin:0;font-size:16px}.menu-item-main p{font-size:11px;line-height:1.4;color:var(--muted);margin:5px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.menu-item-bottom{display:flex;justify-content:space-between;align-items:center}.menu-item .round-add{width:35px;height:35px}.detail-image{height:min(48vh,430px);min-height:290px;position:relative;background:#1c1c1c}.detail-image img{width:100%;height:100%;object-fit:contain;display:block;background:#201b18}.detail-image:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.35))}.detail-back{position:absolute;z-index:2;top:25px;left:18px}.detail-panel{position:relative;z-index:3;margin:-34px 10px 0;border-radius:28px 28px 25px 25px;background:linear-gradient(155deg,#333 0%,#1e1e1e 75%);color:white;padding:25px 23px 27px;box-shadow:0 18px 38px rgba(0,0,0,.28)}.detail-panel h1{font-size:31px;margin:0 0 9px;letter-spacing:-1px}.detail-panel p{font-size:13px;line-height:1.65;color:#ddd;margin:0}.detail-tags{display:flex;gap:8px;margin:18px 0 24px;flex-wrap:wrap}.detail-tag{background:#414141;color:#e5e5e5;border-radius:999px;padding:9px 11px;font-size:11px}.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.stepper{display:flex;align-items:center;gap:15px;background:#3b3b3b;border-radius:999px;padding:5px 9px;color:white}.stepper button{border:0;background:transparent;color:var(--yellow);font-size:22px;width:29px;height:32px}.stepper strong{font-size:14px;min-width:12px;text-align:center}.detail-panel .price{font-size:23px}.primary{border:0;background:var(--yellow);color:#161616;font-weight:800;border-radius:17px;min-height:53px;width:100%;font-size:14px;box-shadow:0 8px 20px rgba(255,201,0,.16)}.cart-content{padding:18px 16px 28px}.cart-list{display:grid;gap:10px}.cart-item{display:flex;align-items:center;gap:12px;padding:11px;background:#fffdfa;border-radius:20px;box-shadow:var(--shadow)}.cart-item img{width:74px;height:72px;object-fit:cover;border-radius:15px}.cart-item-info{flex:1;min-width:0}.cart-item-info strong{font-size:14px}.cart-item-info .price{display:block;font-size:14px;margin-top:5px}.cart-item .stepper{background:#eeeae5;color:#222;gap:4px;padding:2px 3px}.cart-item .stepper button{width:26px;color:#8c6900}.cart-item .stepper strong{font-size:12px}.cart-title{font-size:20px;margin:30px 0 14px;letter-spacing:-.6px}.fulfillment{display:grid;gap:9px}.fulfill{width:100%;border:1px solid #e8e3df;background:#eae6e1;color:#191919;border-radius:20px;padding:14px 15px;display:flex;align-items:center;gap:13px;text-align:left;min-height:80px}.fulfill.selected{background:#fffdf9;border:2px solid #e8b500;padding:13px 14px;box-shadow:0 7px 18px rgba(164,115,0,.1)}.fulfill-icon{width:49px;height:49px;border-radius:14px;display:grid;place-items:center;background:#f2ede6;flex:none}.fulfill.selected .fulfill-icon{background:#ffe68a}.fulfill-icon svg{width:25px;height:25px}.fulfill strong{font-size:14px}.fulfill small{display:block;color:#77716d;font-size:11px;margin-top:4px}.fulfill-check{margin-left:auto;font-weight:900;color:#9e7800}.summary{margin-top:25px;border-top:1px solid #ddd6ce;padding-top:20px}.summary-line{display:flex;justify-content:space-between;margin:9px 0;font-size:13px}.summary-line.total{font-size:21px;font-weight:800;margin:20px 0}.checkout-form{display:grid;gap:12px;margin-top:18px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #ddd6ce;border-radius:13px;padding:12px 13px;background:#fff;font-size:14px;min-height:46px}.field textarea{resize:vertical;min-height:70px}.empty{text-align:center;padding:75px 20px;color:#67615a}.empty h2{color:#202020}.empty .primary{max-width:240px}.toast{position:fixed;z-index:60;bottom:92px;left:50%;transform:translateX(-50%);width:min(370px,calc(100% - 36px));padding:13px 17px;border-radius:15px;background:#242424;color:#fff;box-shadow:0 10px 30px #0004;font-size:13px;text-align:center}.profile{padding:25px 20px}.profile-box{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--shadow)}.profile p{font-size:13px;line-height:1.6;color:#666}.profile a{color:#785c00}.mini-tag{display:inline-block;border-radius:99px;background:#fff0b0;color:#4a3800;padding:6px 10px;font-size:10px;font-weight:800;margin-top:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:355px){.hero{padding-left:14px;padding-right:14px}.content{padding-left:13px;padding-right:13px}.product-img{height:120px}.product-info{padding:9px}.product-title{font-size:14px}.price{font-size:15px}.menu-item img{width:88px;height:88px}.category{min-width:61px}.navbar{width:calc(100% - 16px)}}@media(min-width:600px){body{padding:30px 0}.app{border-radius:28px;min-height:850px}.navbar{bottom:22px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
.hero.hero-with-banner{display:block;min-height:0;padding:0;background:#242424;border-radius:0 0 26px 26px;overflow:hidden}.welcome-banner{display:block;width:100%;height:auto;aspect-ratio:1199/1312;object-fit:contain;background:#242424}.hero-controls{padding:0 17px 13px}.hero-with-banner .search{margin-top:0}.hero-with-banner .categories{padding-top:12px;padding-bottom:0}.hero-with-banner .category{min-height:62px}@media(max-width:355px){.hero-controls{padding-left:12px;padding-right:12px}}</style><script src="https://telegram.org/js/telegram-web-app.js"></script><style>

</style></head><body><div class="app"><main id="view" aria-live="polite"></main><nav class="navbar" id="nav" aria-label="Основная навигация"></nav><div id="toast" class="toast hide" role="status"></div></div><script>
const products=[{id:'plov',name:'Плов',category:'Плов',price:650,weight:'400 г',desc:'Плов с говядиной, рисом и морковью.',img:'assets/plov.jpg'},{id:'lagman',name:'Лагман',category:'Горячее',price:590,weight:'350 г',desc:'Лапша с мясом и овощами.',img:'assets/lagman.jpg'},{id:'shurpa',name:'Шурпа',category:'Супы',price:550,weight:'400 г',desc:'Наваристый суп с мясом и овощами.',img:'assets/shurpa.jpg'},{id:'samsa',name:'Самса',category:'Выпечка',price:180,weight:'1 шт.',desc:'Румяная выпечка с мясной начинкой.',img:'assets/samsa.jpg'},{id:'salad',name:'Салат',category:'Салаты',price:190,weight:'150 г',desc:'Овощной салат.',img:'assets/salad.jpg'},{id:'bread',name:'Лепёшка',category:'Выпечка',price:70,weight:'1 шт.',desc:'Свежая лепёшка.',img:'assets/bread.jpg'}];
const cats=['Все','Плов','Горячее','Супы','Выпечка','Салаты'];const icon=(name)=>{let p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',menu:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',cart:'<circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M2 3h2l3 13h13l2-10H5"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',bag:'<rect x="4" y="8" width="16" height="13" rx="2"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/>',bike:'<circle cx="5" cy="17" r="3"/><circle cx="19" cy="17" r="3"/><path d="m5 17 5-10 4 10h5l-5-10h-4"/>',bowl:'<path d="M3 12h18a9 9 0 0 1-18 0ZM8 4c-3 3 3 3 0 6M14 4c-3 3 3 3 0 6"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',leaf:'<path d="M20 4C8 4 4 10 4 16a5 5 0 0 0 5 5c6 0 11-6 11-17ZM4 20c4-5 8-8 13-11"/>',bread:'<path d="M4 18c-2-7 2-13 8-13s10 6 8 13c-2 4-14 4-16 0ZM9 8l-1 4m6-5-1 4"/>'}[name]||'';return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`};
const readCart=()=>{try{return JSON.parse(localStorage.getItem('khavchik-cart-v27')||'{}')}catch{return {}}};let cart=readCart(),page='home',category='Все',query='',selected=null,detailQty=1,method='pickup';const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);const total=()=>products.reduce((sum,p)=>sum+p.price*(cart[p.id]||0),0);const save=()=>localStorage.setItem('khavchik-cart-v27',JSON.stringify(cart));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){let el=document.getElementById('toast');el.textContent=s;el.classList.remove('hide');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.add('hide'),2400)}
function go(p){page=p;selected=null;render();window.scrollTo(0,0)}function setCat(c){category=c;page='menu';render();window.scrollTo(0,0)}function openProduct(id){selected=id;detailQty=1;page='detail';render();window.scrollTo(0,0)}function add(id,qty=1){cart[id]=(cart[id]||0)+qty;if(cart[id]<=0)delete cart[id];save();render();notify('Корзина обновлена')}function adjust(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];save();render()}function qty(d){detailQty=Math.max(1,detailQty+d);render()}
function card(p){return `<article class="product-card"><img class="product-img" src="${p.img}" alt="${p.name}" width="400" height="300" loading="lazy" onclick="openProduct('${p.id}')"><div class="product-info"><div class="product-title" onclick="openProduct('${p.id}')">${p.name}</div><div class="product-sub">${p.desc}</div><div class="product-bottom"><span class="price">${money(p.price)}</span><button class="round-add" aria-label="Добавить ${p.name}" onclick="add('${p.id}')">+</button></div></div></article>`}
function tabs(){return `<div class="menu-tabs">${cats.map(c=>`<button class="pill ${category===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}</div>`}
function home(){return `<div class="screen"><section class="hero hero-with-banner"><div class="brand-strip"><div class="brand-identity"><img src="assets/original-sign-symbol.jpg" alt="Фирменный знак с вывески Хавчика" width="29" height="29">Хавчик</div><div class="work-hours" aria-label="Ежедневно с 11 до 22"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>Пн–Вс · 11:00–22:00</div></div><img class="welcome-banner" src="assets/khavchik-approved-welcome.png" alt="Хавчик — добро пожаловать! Заказы в кафе, на самовывоз и с доставкой" width="1199" height="1312" loading="eager" decoding="async"><div class="hero-controls"><label class="search">${icon('search')}<span class="sr-only">Поиск блюд</span><input id="homeSearch" placeholder="Поиск блюд..." value="${esc(query)}" oninput="searchHome(this.value)"></label><div class="categories" aria-label="Категории блюд">${cats.map((c,i)=>`<button class="category ${i===0?'active':''}" onclick="setCat('${c}')">${icon(['grid','bowl','bowl','bowl','bread','leaf'][i])}<span>${c}</span></button>`).join('')}</div></div></section><section class="content"><div class="section-head"><h2>Популярное</h2><button class="text-link" onclick="setCat('Все')">Смотреть все ↗</button></div><div class="product-grid">${products.slice(0,4).map(card).join('')}</div><p class="demo-note">Демо: изображения блюд и цены требуют подтверждения заведением.</p></section></div>`}
function searchHome(v){query=v;if(v.trim()){page='menu';render();let inp=document.getElementById('menuSearch');if(inp){inp.focus();inp.setSelectionRange(v.length,v.length)}}}
function menu(){let list=products.filter(p=>(category==='Все'||p.category===category)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase())));return `<div class="screen"><header class="page-top"><button class="back" onclick="go('home')" aria-label="Назад">‹</button><h1>Меню</h1><span style="width:40px"></span></header><div style="padding:15px 18px 0"><label class="search" style="margin:0;background:#e9e4df;border-color:#e1dad1;color:#333">${icon('search')}<input id="menuSearch" style="color:#222" placeholder="Найти блюдо..." value="${esc(query)}" oninput="query=this.value;updateMenuList()"></label></div>${tabs()}<div class="menu-list" id="menuList">${list.map(menuItem).join('')||'<p class="empty">Ничего не найдено</p>'}</div><p class="demo-note" style="padding:0 18px">Цены демонстрационные.</p></div>`}
function menuItem(p){return `<article class="menu-item"><img src="${p.img}" alt="${p.name}" width="105" height="95" loading="lazy" onclick="openProduct('${p.id}')"><div class="menu-item-main"><h3 onclick="openProduct('${p.id}')">${p.name}</h3><p>${p.desc}</p><div class="menu-item-bottom"><strong class="price">${money(p.price)}</strong><button class="round-add" onclick="add('${p.id}')" aria-label="Добавить ${p.name}">+</button></div></div></article>`}
function updateMenuList(){let list=products.filter(p=>(category==='Все'||p.category===category)&&(`${p.name} ${p.desc}`.toLowerCase().includes(query.toLowerCase())));document.getElementById('menuList').innerHTML=list.map(menuItem).join('')||'<p class="empty">Ничего не найдено</p>'}
function detail(){let p=products.find(x=>x.id===selected);if(!p)return home();return `<div class="screen" style="background:#f6f3ef"><div class="detail-image"><img src="${p.img}" alt="${p.name}" width="900" height="700"><button class="back detail-back" onclick="go('menu')" aria-label="Назад">‹</button></div><div class="detail-panel"><h1>${p.name}</h1><p>${p.desc}</p><div class="detail-tags"><span class="detail-tag">${p.weight}</span><span class="detail-tag">Домашняя кухня</span></div><div class="detail-actions"><div class="stepper"><button onclick="qty(-1)" aria-label="Уменьшить">−</button><strong>${detailQty}</strong><button onclick="qty(1)" aria-label="Увеличить">+</button></div><span class="price">${money(p.price*detailQty)}</span></div><button class="primary" onclick="add('${p.id}',detailQty);go('cart')">Добавить в корзину</button></div><p class="demo-note" style="padding:0 24px">Фото и цена демонстрационные.</p></div>`}
function cartPage(){let entries=products.filter(p=>cart[p.id]);return `<div class="screen"><header class="page-top"><button class="back" onclick="go('home')" aria-label="Назад">‹</button><h1>Корзина</h1><span style="width:40px"></span></header><div class="cart-content">${!entries.length?`<div class="empty"><h2>Пока пусто</h2><p>Добавьте любимые блюда из меню</p><button class="primary" onclick="go('menu')">Открыть меню</button></div>`:`<div class="cart-list">${entries.map(p=>`<article class="cart-item"><img src="${p.img}" alt="${p.name}" width="74" height="72"><div class="cart-item-info"><strong>${p.name}</strong><span class="price">${money(p.price*cart[p.id])}</span></div><div class="stepper"><button onclick="adjust('${p.id}',-1)" aria-label="Уменьшить ${p.name}">−</button><strong>${cart[p.id]}</strong><button onclick="adjust('${p.id}',1)" aria-label="Увеличить ${p.name}">+</button></div></article>`).join('')}</div><h2 class="cart-title">Способ получения</h2><div class="fulfillment"><button class="fulfill ${method==='hall'?'selected':''}" onclick="method='hall';render()"><span class="fulfill-icon">${icon('bowl')}</span><span><strong>В зале</strong><small>Заказ к вашему столику</small></span><span class="fulfill-check">${method==='hall'?'✓':''}</span></button><button class="fulfill ${method==='pickup'?'selected':''}" onclick="method='pickup';render()"><span class="fulfill-icon">${icon('bag')}</span><span><strong>Самовывоз</strong><small>Заберу сам из кафе</small></span><span class="fulfill-check">${method==='pickup'?'✓':''}</span></button><button class="fulfill ${method==='delivery'?'selected':''}" onclick="method='delivery';render()"><span class="fulfill-icon">${icon('bike')}</span><span><strong>Доставка</strong><small>К вам домой или в офис</small></span><span class="fulfill-check">${method==='delivery'?'✓':''}</span></button></div><div class="summary"><div class="summary-line"><span>Блюда</span><strong>${money(total())}</strong></div>${method==='delivery'?'<div class="summary-line"><span>Доставка</span><span>Рассчитывается отдельно</span></div>':''}<div class="summary-line total"><span>Итого за блюда</span><span>${money(total())}</span></div></div><button class="primary" onclick="go('checkout')">Оформить тестовый заказ</button><p class="demo-note">Оплата не производится. Заказ в кафе не отправляется.</p>`}</div></div>`}
function checkout(){if(!count()){go('cart');return ''}return `<div class="screen"><header class="page-top"><button class="back" onclick="go('cart')" aria-label="Назад">‹</button><h1>Оформление</h1><span style="width:40px"></span></header><div class="cart-content"><div class="profile-box"><strong>${method==='hall'?'В зале':method==='pickup'?'Самовывоз':'Доставка'}</strong><p>${method==='hall'?'Укажите номер столика':method==='pickup'?'Москва, ул. Космонавта Волкова, 6А':'Укажите адрес для тестового оформления'}</p><strong>Блюда: ${money(total())}</strong></div><form class="checkout-form" onsubmit="submitDemo(event)"><div class="field"><label for="customer">Как к вам обращаться</label><input id="customer" maxlength="80" placeholder="Имя" required autocomplete="name"></div>${method==='hall'?'<div class="field"><label for="tableNumber">Номер столика</label><input id="tableNumber" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" placeholder="Например, 5" required><div class="field-hint">Номер указан на столике или уточните у сотрудника.</div></div>':''}${method==='delivery'?'<div class="field"><label for="address">Адрес доставки</label><input id="address" maxlength="180" placeholder="Улица, дом, квартира" required autocomplete="street-address"></div>':''}<div class="field"><label for="comment">Комментарий (необязательно)</label><textarea id="comment" maxlength="300" placeholder="Пожелания к заказу"></textarea></div><button class="primary" type="submit">Подтвердить тестовый заказ</button></form><p class="demo-note">Данные используются только на этом экране. Ничего не отправляется и не сохраняется на сервере.</p></div></div>`}
function submitDemo(e){e.preventDefault();cart={};save();page='success';render();window.scrollTo(0,0)}function success(){return `<div class="screen"><header class="page-top"><h1>Готово</h1></header><div class="empty"><div style="font-size:45px;color:#c59b00">✓</div><h2>Тестовый заказ оформлен</h2><p>Это демонстрация интерфейса. Заказ не отправлен в кафе.</p><button class="primary" onclick="go('home')">На главную</button></div></div>`}
function profile(){return `<div class="screen"><header class="page-top"><h1>О приложении</h1></header><div class="profile"><div class="profile-box"><h2>Хавчик</h2><p>Демонстрационный прототип Telegram Mini App для кафе в Москве.</p><p><strong>Адрес:</strong> ул. Космонавта Волкова, 6А.</p><p>Каталог, фотографии и цены служат для тестирования дизайна. Реальные заказы пока не принимаются.</p><a href="https://yandex.ru/maps/-/CXGzR83O" target="_blank" rel="noopener">Посмотреть кафе на карте</a><br><span class="mini-tag">Версия: Telegram Mini App · DEMO</span></div></div></div>`}
function render(){const views={home,menu,detail,cart:cartPage,checkout,success,profile};document.getElementById('view').innerHTML=(views[page]||home)();let navs=[['home','Главная','home'],['menu','Меню','menu'],['cart','Корзина','cart'],['profile','Профиль','user']];document.getElementById('nav').innerHTML=navs.map(([p,label,ico])=>`<button class="navbtn ${page===p||(page==='detail'&&p==='menu')||(page==='checkout'&&p==='cart')?'active':''}" onclick="go('${p}')">${icon(ico)}<span>${label}</span>${p==='cart'&&count()?`<span class="count-dot">${count()}</span>`:''}</button>`).join('')};render();

// Telegram Mini App: клиентская интеграция, без доверия к initDataUnsafe.
(function initTelegram(){
 const tg=window.Telegram?.WebApp;
 if(!tg) return;
 try {
   tg.ready();
   tg.expand();
   tg.setHeaderColor('#242424');
   tg.setBackgroundColor('#f6f3ef');
   document.documentElement.classList.add('telegram-webapp');
 } catch(e) { console.warn('Telegram WebApp initialization:', e); }
})();
</script></body></html>
